name: Release

# Publishing is deliberately manual or tag-driven rather than on every push to
# master: a version once on Maven Central can never be replaced, only superseded.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Run the tests before publishing. An artifact that fails its own suite must
      # not reach a repository nobody can delete from.
      - name: Build and test
        run: ./gradlew build --stacktrace

      - name: Publish
        run: ./gradlew publishAllPublicationsToCentralRepository --stacktrace
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
